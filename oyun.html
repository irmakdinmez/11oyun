/* Layout: tek sütun oyun kolonu — ünite sekmeleri, alt bölüm listesi, alt bölüm içinde 5 bölümlük zikzak yol; ders ekranında soru + çizim, altta geri bildirim paneli.

  --bg:#FFFFFF; --ink:#000000; --o:#1E6FD9; --o-deep:#124A9A; --o-soft:#E4F3FD; --sky:#7CC8F2; --sky-deep:#3E9ED6;

  color-scheme:light;
}

*{font-size:var(--fs)}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--o);outline-offset:2px}
b,strong{font-weight:700}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
.up{text-transform:uppercase;letter-spacing:.06em;font-weight:700}

/* üst bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--ink)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px}
.brand{font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.brand span{color:var(--o)}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:700;border:2px solid var(--ink);border-radius:10px;padding:2px 10px;font-variant-numeric:tabular-nums}
.chip svg{width:16px;height:16px}

/* ünite sekmeleri */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.tab{border:2px solid var(--ink);border-bottom-width:5px;border-radius:12px;padding:8px 6px;font-weight:700;line-height:1.2;text-align:center;background:var(--bg)}
.tab small{display:block;font-weight:400;color:var(--mute)}
.tab[aria-selected="true"]{background:var(--o);color:#fff;border-color:var(--o);border-bottom-color:var(--o-deep)}
.tab[aria-selected="true"] small{color:#fff}
.unit-head{margin-top:20px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.unit-head b{text-transform:uppercase;letter-spacing:.06em}
.unit-head span{color:var(--mute)}
.unit-note{margin:10px 0 0;color:var(--mute)}

/* alt bölüm listesi */
.subs{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.sub{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:12px 14px;background:var(--bg)}
.sub:not(:disabled):hover{border-color:var(--ink)}
.sub:disabled{cursor:not-allowed}
.sub .num{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--ink)}
.sub.done .num{background:var(--sky);border-color:var(--sky);color:#000}
.sub.open .num{background:var(--o);border-color:var(--o);color:#fff}
.sub.locked .num,.sub.soon .num{border-color:var(--line);color:var(--mute)}
.sub .num svg{width:20px;height:20px}
.sub .txt{flex:1;min-width:0}
.sub .txt b{display:block;line-height:1.25}
.sub.locked .txt b,.sub.soon .txt b{color:var(--mute)}
.sub .txt span{color:var(--mute)}
.bar5{display:flex;gap:4px;margin-top:6px}
.bar5 i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.bar5 i.on{background:var(--sky)}
.tagsoon{flex:0 0 auto;border:2px dashed var(--line);border-radius:8px;padding:0 8px;color:var(--mute)}

/* alt bölüm ekranı: 5 bölümlük yol */
.subhead{display:flex;align-items:center;gap:10px;padding-block:14px;border-bottom:2px solid var(--ink)}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:700;border:2px solid var(--ink);border-radius:10px;padding:4px 10px}
.subhead .t{min-width:0}
.subhead .t b{display:block}
.subhead .t span{color:var(--mute)}
.path{display:flex;flex-direction:column;align-items:center;gap:28px;padding-block:34px 10px;overflow-x:clip}
.stop{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.node{width:76px;height:70px;border-radius:50%;display:grid;place-items:center;position:relative;transition:transform .1s}
.node svg{width:30px;height:30px}
.node.open{background:var(--o);box-shadow:0 7px 0 var(--o-deep);color:#fff}
.node.done{background:var(--sky);box-shadow:0 7px 0 var(--sky-deep);color:#000}
.node.locked{background:var(--soft);box-shadow:0 7px 0 var(--line);color:var(--mute);cursor:not-allowed}
.node:not(.locked):active{transform:translateY(5px);box-shadow:0 2px 0 var(--o-deep)}
.node.cur::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--o);opacity:.4;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.92);opacity:.6}100%{transform:scale(1.16);opacity:0}}
.start-tag{position:absolute;top:-36px;background:var(--bg);color:var(--o);border:2px solid var(--o);font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:0 10px;border-radius:9px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.stop-label{text-align:center}
.stop-label b{display:block}
.stop-label span{color:var(--mute)}
.stars{display:flex;gap:2px;justify-content:center}
.stars svg{width:16px;height:16px}
.pop{margin-top:4px;width:min(270px,calc(100vw - 110px));border:2px solid var(--ink);border-bottom-width:5px;border-radius:14px;padding:12px 14px 14px;background:var(--bg);display:flex;flex-direction:column;gap:10px;text-align:left}
.pop p{margin:0}
.btn{border-radius:12px;padding:11px 16px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--o);color:#fff;box-shadow:0 4px 0 var(--o-deep);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--o-deep)}
.foot{display:flex;justify-content:center;margin-top:28px}
.linkbtn{color:var(--mute);text-decoration:underline;text-underline-offset:3px}

/* ders ekranı */
#lesson{min-height:100%;display:flex;flex-direction:column}
.lbar .wrap{display:flex;align-items:center;gap:12px;padding-block:16px 6px}
.x{padding:4px;display:grid;place-items:center}
.x svg{width:24px;height:24px}
.prog{flex:1;height:14px;border-radius:8px;background:var(--soft);border:2px solid var(--ink);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--sky);transition:width .35s ease}
.hearts{display:flex;gap:3px}
.hearts svg{width:24px;height:24px}
.hearts svg.lost path{fill:none;stroke:var(--line);stroke-width:2}
.hearts svg.hit{animation:shake .45s}
@keyframes shake{25%{transform:translateX(-4px) rotate(-8deg)}75%{transform:translateX(4px) rotate(8deg)}}
.qarea .wrap{display:flex;flex-direction:column;gap:14px;padding-block:10px 230px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{border:2px solid var(--ink);border-radius:8px;padding:0 8px;font-weight:700}
.tag.o{border-color:var(--o);color:var(--o)}
.combo{font-weight:700;color:var(--o)}
.qtext{margin:0;font-weight:700;text-wrap:pretty}
.figbox{display:flex;justify-content:center;overflow-x:auto}
svg.fig{display:block;max-width:100%;height:auto}
svg.fig text{font-family:var(--f);font-size:16px}
table.ft{border-collapse:collapse;font-variant-numeric:tabular-nums}
table.ft th,table.ft td{border:1.5px solid var(--ink);padding:6px 12px;text-align:center}
table.ft th{font-weight:700;background:var(--soft)}
table.ft td:first-child{font-weight:700;text-align:left}
.reading{margin:0 0 12px;padding:12px 14px;border:2px solid var(--sky-deep);background:var(--o-soft);border-radius:12px;line-height:1.5;color:var(--ink)}
.reading .rh{display:block;font-weight:700;color:var(--o-deep);margin-bottom:6px}
.reading p{margin:0 0 8px}.reading p:last-child{margin:0}
.onc{margin:0;padding:10px 14px;border:2px solid var(--ink);border-radius:12px;list-style:none;display:flex;flex-direction:column;gap:6px}
.onc li{display:flex;gap:10px}
.onc li b{flex:0 0 28px;color:var(--o)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--bg);border:2px solid var(--line);border-bottom-width:5px;border-radius:12px;padding:10px 12px;line-height:1.3;transition:border-color .12s,transform .08s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:active:not(:disabled){transform:translateY(2px);border-bottom-width:3px}
.opt .k{flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700}
.opt span:last-child{min-width:0}
.opt.sel{border-color:var(--ink);background:var(--soft)}
.opt.sel .k{border-color:var(--ink)}
.opt.right{border-color:var(--ink);background:var(--soft)}
.opt.right .k{border-color:var(--ink);background:var(--ink);color:#fff}
.opt.wrong{border-color:var(--o);background:var(--o-soft)}
.opt.wrong .k{border-color:var(--o);background:var(--o);color:#fff}
.opt:disabled{cursor:default}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .wrap{padding-block:14px 16px;display:flex;flex-direction:column;gap:12px}
.sheet.good{background:var(--o-soft)}
.sheet.bad{background:var(--o-soft);border-top-color:var(--o)}
.fb{display:none;gap:12px;align-items:flex-start}
.sheet.good .fb,.sheet.bad .fb{display:flex}
.fb .ic{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff}
.sheet.bad .fb .ic{background:var(--o)}
.fb .ic svg{width:22px;height:22px}
.fb>div{min-width:0}
.fb h4{margin:0;text-transform:uppercase;letter-spacing:.06em}
.sheet.bad h4{color:var(--o)}
.fb .ans{margin:2px 0 0;font-weight:700}
.fb .exp{margin:4px 0 0;max-height:28vh;overflow:auto}
.mainbtn{width:100%;border-radius:12px;padding:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--o);box-shadow:0 5px 0 var(--o-deep);transition:transform .08s}
.mainbtn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--o-deep)}
.mainbtn:disabled{background:var(--soft);color:var(--mute);box-shadow:0 5px 0 var(--line);cursor:not-allowed}
.sheet.bad .mainbtn{background:var(--o);box-shadow:0 5px 0 var(--o-deep)}

/* sonuç */
.result{min-height:100%;display:flex;align-items:center}
.result .wrap{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding-block:40px}
.result h2{margin:0;text-transform:uppercase;letter-spacing:.06em}
.result p{margin:0;max-width:40ch}
.badge{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;color:#fff}
.badge svg{width:56px;height:56px}
.badge.win{background:var(--sky);box-shadow:0 8px 0 var(--sky-deep);color:#000}
.badge.lose{background:var(--o);box-shadow:0 8px 0 var(--o-deep)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tile{border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.tile b{display:block;background:var(--ink);color:#fff;padding:3px}
.tile span{display:block;padding:10px 4px;font-weight:700;font-variant-numeric:tabular-nums}
.col{display:flex;flex-direction:column;gap:12px;width:100%}
.ghost{width:100%;border:2px solid var(--ink);border-bottom-width:5px;border-radius:12px;padding:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.bigstars{display:flex;gap:6px}
.bigstars svg{width:32px;height:32px}

.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal .card{width:100%;max-width:600px;background:var(--bg);border-top:2px solid var(--ink);border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;text-align:center}
.modal h3{margin:0;text-transform:uppercase;letter-spacing:.06em}
.modal p{margin:0}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

const INK="#000", OR="#1E6FD9", SKY="#7CC8F2";
const col = c => c===2 ? SKY : c ? OR : INK;
const T = (x,y,s,a="middle",c=INK,w) => `<text x="${x}" y="${y}" text-anchor="${a}" fill="${c}"${w?' font-weight="700"':''}>${s}</text>`;
const Ln = (x1,y1,x2,y2,c=INK,w=1.6,d) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}"${d?' stroke-dasharray="5 4"':''}/>`;
const svgWrap = (w,h,b) => `<svg class="fig" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img">${b}</svg>`;
const fn = s => new Function("x","return "+s);
function ground(x1,x2,y){ let s=Ln(x1,y,x2,y,INK,2); for(let x=x1+4;x<x2;x+=12) s+=Ln(x,y+2,x-8,y+10,INK,1.2); return s; }

function graph(o){
  const W=340,H=240,l=52,r=34,t=30,b=40, pw=W-l-r, ph=H-t-b;
  const y0=o.ymin||0, X=v=>l+v/o.xmax*pw, Y=v=>t+ph-(v-y0)/(o.ymax-y0)*ph;
  let s="";
  if(o.sh){ const f=fn(o.sh.f); let pts=[]; for(let i=0;i<=30;i++){const x=o.sh.a+(o.sh.b-o.sh.a)*i/30; pts.push(`${X(x)},${Y(f(x))}`);}
    s+=`<polygon points="${X(o.sh.a)},${Y(0)} ${pts.join(" ")} ${X(o.sh.b)},${Y(0)}" fill="${SKY}" fill-opacity=".45" stroke="none"/>`;
    for(let i=1;i<8;i++){ const x=o.sh.a+(o.sh.b-o.sh.a)*i/8; s+=Ln(X(x),Y(0),X(x),Y(f(x)),OR,1); }
    if(o.sh.l){ const xm=(o.sh.a+o.sh.b)/2; s+=`<rect x="${X(xm)-26}" y="${Y(f(xm)/2)-14}" width="52" height="22" fill="#fff" stroke="${OR}"/>`+T(X(xm),Y(f(xm)/2)+3,o.sh.l,"middle",OR,1); } }
  (o.g||[]).forEach(([gx,gy])=>{ s+=Ln(X(gx),Y(gy),X(gx),Y(0),INK,1,1)+Ln(X(gx),Y(gy),X(0),Y(gy),INK,1,1); });
  // eksenler
  s+=Ln(X(0),Y(0),W-r+16,Y(0),INK,2)+`<polygon points="${W-r+22},${Y(0)} ${W-r+12},${Y(0)-5} ${W-r+12},${Y(0)+5}" fill="${INK}"/>`;
  s+=Ln(X(0),Y(y0),X(0),t-14,INK,2)+`<polygon points="${X(0)},${t-20} ${X(0)-5},${t-10} ${X(0)+5},${t-10}" fill="${INK}"/>`;
  s+=T(X(0)+10,t-8,o.y,"start")+T(W-2,Y(0)+30,o.x,"end")+T(X(0)-8,Y(0)+18,"0","end");
  (o.xt||[]).forEach(([v,lb])=>{ s+=Ln(X(v),Y(0)-4,X(v),Y(0)+4,INK,1.6)+T(X(v),Y(0)+20,lb); });
  (o.yt||[]).forEach(([v,lb])=>{ s+=Ln(X(0)-4,Y(v),X(0)+4,Y(v),INK,1.6)+T(X(0)-8,Y(v)+5,lb,"end"); });
  (o.s||[]).forEach(se=>{
    let pts;
    if(se.f){ const f=fn(se.f); pts=[]; for(let i=0;i<=40;i++){const x=se.a+(se.b-se.a)*i/40; pts.push([x,f(x)]);} } else pts=se.p;
    s+=`<polyline points="${pts.map(p=>X(p[0])+","+Y(p[1])).join(" ")}" fill="none" stroke="${col(se.c)}" stroke-width="2.4"${se.d?' stroke-dasharray="7 5"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    if(se.l){ if(se.lp){ s+=T(X(se.lp[0]),Y(se.lp[1]),se.l,"start",col(se.c),1); } else { const e=pts[pts.length-1], up=pts.length>1 && pts[pts.length-1][1] >= pts[0][1]; s+=T(X(e[0])+8,Y(e[1])+(up?-4:14),se.l,"start",col(se.c),1); } }
  });
  (o.dots||[]).forEach(([dx,dy,c])=>{ s+=`<circle cx="${X(dx)}" cy="${Y(dy)}" r="4.5" fill="${col(c)}"/>`; });
  return svgWrap(W,H,s);
}

function column(o){
  const W=320, top=o.tap?46:26, hpx=o.px||230, cx=130;
  const Y=u=>top+u/o.max*hpx;
  const H=Y(o.max)+(o.ground?22:14)+(o.note?30:0);
  let s="";
  if(o.tap){ s+=`<path d="M${cx-60} ${top-30} h52 v10 h-4 v8 h-40 v-8 h-8 z" fill="none" stroke="${INK}" stroke-width="2"/>`+Ln(cx-60,top-30,cx-60,top-14,INK,2); }
  s+=Ln(cx,Y(0),cx,Y(o.max),INK,1,1);
  if(o.rect) s+=`<rect x="${cx-20}" y="${Y(o.rect[0])}" width="40" height="${Y(o.rect[1])-Y(o.rect[0])}" fill="none" stroke="${OR}" stroke-width="2"/>`+Ln(cx-20,(Y(o.rect[0])+Y(o.rect[1]))/2,cx+20,(Y(o.rect[0])+Y(o.rect[1]))/2,OR,1.2);
  (o.marks||[]).forEach(([u,lb])=>{ s+=Ln(cx-9,Y(u),cx+9,Y(u),INK,2); const parts=String(lb).split("  "); if(parts[1]) s+=`<text x="${cx-16}" y="${Y(u)+5}" text-anchor="end" fill="${INK}">${parts[1]}  <tspan font-weight="700">${parts[0]}</tspan></text>`.replace(/  /,"\u00a0\u00a0"); else s+=T(cx-16,Y(u)+5,parts[0],"end",INK,1); });
  (o.segs||[]).forEach(([a,b,lb,c,side])=>{ const L=side==="l", x=L?cx-80:cx+54, cc=col(c);
    s+=Ln(x,Y(a),x,Y(b),cc,1.6)+Ln(x-6,Y(a),x+6,Y(a),cc,1.6)+Ln(x-6,Y(b),x+6,Y(b),cc,1.6);
    s+=T(L?x-10:x+10,(Y(a)+Y(b))/2+5,lb,L?"end":"start",cc,c?1:0); });
  (o.balls||[]).forEach((u,i)=>{ s+=`<circle cx="${cx}" cy="${Y(u)}" r="7.5" fill="${i===0?INK:"#fff"}" stroke="${INK}" stroke-width="2"/>`; });
  (o.drops||[]).forEach(([u,lb])=>{ const y=Y(u)-(u===o.max&&o.ground?7:0);
    s+=`<path d="M${cx} ${y-9} C ${cx+7} ${y-1}, ${cx+6} ${y+6}, ${cx} ${y+6} C ${cx-6} ${y+6}, ${cx-7} ${y-1}, ${cx} ${y-9} z" fill="${INK}"/>`+T(cx-14,y+5,lb,"end",INK,1); });
  if(o.ground) s+=ground(30,W-30,Y(o.max)+(o.drops?0:8));
  if(o.note) s+=T(W/2,H-6,o.note);
  return svgWrap(W,H,s);
}

function towers(o){
  const n=o.items.length, W=Math.max(250,n*110), top=48, hpx=180, gy=top+hpx;
  const H=gy+(o.items.some(i=>i.note)?50:24);
  let s=ground(14,W-14,gy);
  o.items.forEach((it,i)=>{
    const x=W/(n+1)*(i+1)-10, y=gy-it.h/o.max*hpx;
    s+=Ln(x,y+9,x,gy,INK,1,1);
    s+=`<circle cx="${x}" cy="${y}" r="9" fill="${INK}"/>`;
    if(it.label) s+=T(x,y-16,it.label,"middle",INK,1);
    s+=Ln(x+18,y,x+18,gy,OR,1.4)+Ln(x+13,y,x+23,y,OR,1.4)+Ln(x+13,gy,x+23,gy,OR,1.4);
    s+=T(x+28,(y+gy)/2+5,it.text,"start",OR,1);
    if(it.note) s+=T(x+6,gy+34,it.note);
  });
  return svgWrap(W,H,s);
}

function table(o){
  return `<table class="ft"><thead><tr>${o.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${o.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
/* Genel sahne: bloklar, kuvvet okları, eğik düzlem, makara, çember, yörünge.
   Koordinatlar piksel; c: 0 siyah, 1 mavi, 2 açık mavi */
function head(x1,y1,x2,y2,c){ const a=Math.atan2(y2-y1,x2-x1), L=11, w=5.5, bx=x2-L*Math.cos(a), by=y2-L*Math.sin(a);
  return `<polygon points="${x2},${y2} ${bx-w*Math.sin(a)},${by+w*Math.cos(a)} ${bx+w*Math.sin(a)},${by-w*Math.cos(a)}" fill="${c}"/>`; }
function scene(o){
  const W=o.w||320, H=o.h||230; let s="";
  for(const it of o.items){ const [t,...a]=it;
    if(t==="box"){ const [x,y,w,h,lb,f]=a; s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f===2?"#E4F3FD":f===3?"#F3F3F3":"#fff"}" stroke="${INK}" stroke-width="2"/>`; if(lb) s+=T(x+w/2,y+h/2+5,lb,"middle",INK,1); }
    else if(t==="rbox"){ const [cx,cy,w,h,ang,lb]=a; s+=`<g transform="rotate(${-ang} ${cx} ${cy})"><rect x="${cx-w/2}" y="${cy-h}" width="${w}" height="${h}" fill="#fff" stroke="${INK}" stroke-width="2"/>${lb?T(cx,cy-h/2+5,lb,"middle",INK,1):""}</g>`; }
    else if(t==="arr"){ const [x1,y1,x2,y2,lb,c,dx,dy]=a, cc=col(c), ang=Math.atan2(y2-y1,x2-x1), ux=Math.cos(ang), uy=Math.sin(ang);
      s+=Ln(x1,y1,x2-8*ux,y2-8*uy,cc,2.4)+head(x1,y1,x2,y2,cc);
      if(lb){ const lx=x2+(dx!=null?dx:ux*8), ly=y2+(dy!=null?dy:(uy>0.3?18:uy<-0.3?-6:5)); const anc=dx!=null?(dx<0?"end":dx>0?"start":"middle"):(ux>0.3?"start":ux<-0.3?"end":"middle"); s+=T(lx,ly,lb,anc,cc,1); } }
    else if(t==="ln"){ const [x1,y1,x2,y2,c,d,w]=a; s+=Ln(x1,y1,x2,y2,col(c),w||1.8,d); }
    else if(t==="dim"){ const [x1,y1,x2,y2,lb,c,side]=a, cc=col(c), v=Math.abs(x2-x1)<1;
      s+=Ln(x1,y1,x2,y2,cc,1.4)+(v?Ln(x1-5,y1,x1+5,y1,cc,1.4)+Ln(x2-5,y2,x2+5,y2,cc,1.4):Ln(x1,y1-5,x1,y1+5,cc,1.4)+Ln(x2,y2-5,x2,y2+5,cc,1.4));
      if(lb) s+= v ? T(side==="l"?x1-8:x1+8,(y1+y2)/2+5,lb,side==="l"?"end":"start",cc,1) : T((x1+x2)/2,side==="t"?y1-7:y1+19,lb,"middle",cc,1); }
    else if(t==="gnd"){ const [x1,x2,y]=a; s+=ground(x1,x2,y); }
    else if(t==="ceil"){ const [x1,x2,y]=a; s+=Ln(x1,y,x2,y,INK,2); for(let x=x1+4;x<x2;x+=12) s+=Ln(x,y-2,x+8,y-10,INK,1.2); }
    else if(t==="wall"){ const [x,y1,y2,side]=a, k=side==="r"?1:-1; s+=Ln(x,y1,x,y2,INK,2); for(let y=y1+4;y<y2;y+=12) s+=Ln(x,y,x+8*k,y+8,INK,1.2); }
    else if(t==="poly"){ const [pts,c,f]=a; s+=`<polygon points="${pts}" fill="${f?"#F3F3F3":"none"}" stroke="${col(c)}" stroke-width="2" stroke-linejoin="round"/>`; }
    else if(t==="circ"){ const [cx,cy,r,c,d,f]=a; s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f===1?INK:f===2?"#E4F3FD":f===3?"#fff":"none"}" stroke="${col(c)}" stroke-width="2"${d?' stroke-dasharray="5 4"':""}/>`; }
    else if(t==="ell"){ const [cx,cy,rx,ry,c,d]=a; s+=`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="${col(c)}" stroke-width="1.8"${d?' stroke-dasharray="5 4"':""}/>`; }
    else if(t==="dot"){ const [x,y,r,c]=a; s+=`<circle cx="${x}" cy="${y}" r="${r||5}" fill="${col(c)}"/>`; }
    else if(t==="txt"){ const [x,y,str,anc,c,b]=a; s+=T(x,y,str,anc||"middle",col(c),b); }
    else if(t==="arc"){ const [cx,cy,r,a1,a2,lb,c]=a, cc=col(c), R=Math.PI/180;
      const p1=[cx+r*Math.cos(a1*R),cy-r*Math.sin(a1*R)], p2=[cx+r*Math.cos(a2*R),cy-r*Math.sin(a2*R)];
      s+=`<path d="M${p1[0]} ${p1[1]} A ${r} ${r} 0 ${Math.abs(a2-a1)>180?1:0} ${a2>a1?0:1} ${p2[0]} ${p2[1]}" fill="none" stroke="${cc}" stroke-width="1.6"/>`;
      if(lb){ const m=(a1+a2)/2*R; s+=T(cx+(r+16)*Math.cos(m),cy-(r+16)*Math.sin(m)+5,lb,"middle",cc,1); } }
    else if(t==="pul"){ const [cx,cy,r]=a; s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="${INK}" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="3" fill="${INK}"/>`; }
    else if(t==="fn"){ const [e,x1,x2,c,d]=a, f=fn(e); let p=[]; for(let i=0;i<=48;i++){ const x=x1+(x2-x1)*i/48; p.push(x.toFixed(1)+","+f(x).toFixed(1)); }
      s+=`<polyline points="${p.join(" ")}" fill="none" stroke="${col(c)}" stroke-width="2.2"${d?' stroke-dasharray="6 5"':""}/>`; }
  }
  return svgWrap(W,H,s);
}
function renderFig(f){ if(!f) return ""; return ({graph,column,towers,table,scene})[f.k](f); }

function save(){ try{ localStorage.setItem(STORE, JSON.stringify(prog)); }catch(e){} }

const partsDone = sub => PARTS.filter((_,p)=>prog.done[key(sub,p)]).length;

let CUR = null, openPop = null;
function openSub(ui, si){ CUR = {ui, si, u:UNITS[ui], s:UNITS[ui].subs[si]}; const d=partsDone(CUR.s.id); openPop = d<5 ? d : null; show("subview"); }
function renderSub(){
  const {u,s} = CUR;
  $("#subTitle").textContent = s.name; $("#subUnit").textContent = u.name;
  const up = partsDone(s.id), offs=[0,52,0,-52,0];
  $("#path").innerHTML = PARTS.map((name,p)=>{
    const done=!!prog.done[key(s.id,p)], locked=false, current=!done && p===PARTS.findIndex((_,k)=>!prog.done[key(s.id,k)]);
    const cls = locked?"locked":done?"done":"open", st=prog.stars[key(s.id,p)]||0;
    const pop = openPop===p && !locked ? `<div class="pop"><p><b>${name}</b></p><p>${s.q[p].length} soru. İstediğin bölümü istediğin sırayla çözebilirsin.</p><button class="btn" data-start="${p}">${done?"Tekrar oyna":"Başla · +"+s.q[p].length*10+" XP"}</button></div>` : "";
    return `<div class="stop" style="transform:translateX(${offs[p]}px)">
      ${current?'<div class="start-tag">Başla</div>':""}
      <button class="node ${cls}${current?" cur":""}" data-node="${p}" aria-label="${name}${locked?" (kilitli)":""}">${locked?ICON.lock:done?ICON.check:ICON.part[p]}</button>
      <div class="stop-label"><b>${name}</b><span>${s.q[p].length} soru</span>${done?`<div class="stars">${[1,2,3].map(k=>ICON.star(k<=st?SKY:"#D6D6D6")).join("")}</div>`:""}</div>

  }).join("");
}
$("#path").addEventListener("click", e=>{

let L=null;

function startPart(p){

  L = {p, qs, i:0, right:0, streak:0, xp:0, sel:null, checked:false, hearts:(p<4?3:null), orders:qs.map(()=>shuffle([0,1,2,3,4]))};

function renderQ(){

  const onc=$("#qOnc"); onc.hidden=!q.p; onc.innerHTML = q.p ? q.p.map((x,k)=>`<li><b>${["I.","II.","III.","IV."][k]}</b><span>${x}</span></li>`).join("") : "";
  $("#opts").innerHTML = ord.map((oi,k)=>`<button class="opt" data-k="${k}"><span class="k">${"ABCDE"[k]}</span><span>${q.o[oi]}</span></button>`).join("");
  $("#progFill").style.width=(L.i/L.qs.length*100)+"%";

  window.scrollTo(0,0);
}
$("#opts").addEventListener("click", e=>{ const b=e.target.closest(".opt"); if(!b||L.checked) return; pick(+b.dataset.k); });
function pick(k){ L.sel=k; [...$("#opts").children].forEach((el,j)=>el.classList.toggle("sel",j===k)); $("#mainBtn").disabled=false; }
function drawHearts(hit){ const h=$("#hearts"); if(L.hearts===null){ h.hidden=true; h.innerHTML=""; return; } h.hidden=false;
  h.innerHTML=[0,1,2].map(n=>ICON.heart.replace("<svg",`<svg class="${n<L.hearts?"":"lost"}${hit&&n===L.hearts?" hit":""}"`)).join(""); h.setAttribute("aria-label","Kalan can: "+L.hearts); }
function check(){
  const q=L.qs[L.i], ord=L.orders[L.i], ck=ord.indexOf(0), ok=L.sel===ck;
  L.checked=true;
  const opts=[...$("#opts").children];
  opts.forEach(el=>{ el.disabled=true; el.classList.remove("sel"); });
  opts[ck].classList.add("right");
  if(ok){ L.right++; L.streak++; L.xp+=10; $("#sheet").className="sheet good"; $("#fbIcon").innerHTML=ICON.check;
    $("#fbTitle").textContent=["Doğru!","Harika!","Aynen böyle!","Mükemmel!"][Math.random()*4|0]; $("#fbAns").textContent=""; }
  else { opts[L.sel].classList.add("wrong"); L.streak=0; $("#sheet").className="sheet bad"; $("#fbIcon").innerHTML=ICON.cross;
    $("#fbTitle").textContent = "Yanlış cevap";
    $("#fbAns").textContent = "Doğru cevap: "+"ABCDE"[ck]+") "+q.o[0];
    if(L.hearts!==null){ L.hearts--; drawHearts(true); if(L.hearts===0) $("#fbTitle").textContent="Yanlış cevap · canların bitti"; } }
  $("#fbExp").textContent=q.e;
  $("#progFill").style.width=((L.i+1)/L.qs.length*100)+"%";
  $("#mainBtn").textContent="Devam";
}
function next(){ if(L.hearts===0){ failScreen(); return; } L.i++; if(L.i>=L.qs.length){ winScreen(); return; } renderQ(); }
$("#mainBtn").addEventListener("click", ()=>{ if(!L) return; L.checked ? next() : (L.sel!==null && check()); });
document.addEventListener("keydown", e=>{
  if($("#lesson").hidden || !$("#modal").hidden || !L) return;
  if(!L.checked && e.key>="1" && e.key<="5") pick(+e.key-1);
  const li="abcde".indexOf(e.key.toLowerCase()); if(!L.checked && li>=0 && e.key.length===1) pick(li);
  if(e.key==="Enter"){ e.preventDefault(); $("#mainBtn").click(); }
});
$("#quitBtn").addEventListener("click", ()=>modal(`<h3>Bölümden çıkılsın mı?</h3><p>Bu bölümdeki ilerlemen kaydedilmez; tekrar girdiğinde baştan başlarsın.</p>
  <button class="mainbtn" data-m="close">Devam et</button><button class="ghost" data-m="quit" style="color:var(--o);border-color:var(--o)">Çık</button>`));

/* ============================================================
   SONUÇ
   ============================================================ */
function winScreen(){
  const k=key(CUR.s.id,L.p), pct=Math.round(L.right/L.qs.length*100), first=!prog.done[k], stars = pct>=90?3:pct>=70?2:1;
  prog.done[k]=true; prog.stars[k]=Math.max(prog.stars[k]||0,stars); prog.xp+=L.xp; save();
  const hasNext = L.p<4;
  const msg = hasNext ? (first?`Sırada ${PARTS[L.p+1]} var.`:"Bölümü yeniden çözdün.")
    : `${CUR.s.name} alt bölümünün son aşamasını bitirdin.`;
  $("#resultBody").innerHTML=`<div class="badge win">${ICON.star("#000")}</div>
    <h2>${PARTS[L.p]} tamamlandı</h2><p>${msg}</p>
    <div class="bigstars">${[1,2,3].map(n=>ICON.star(n<=stars?SKY:"#D6D6D6")).join("")}</div>
    <div class="tiles"><div class="tile"><b>XP</b><span>+${L.xp}</span></div><div class="tile"><b>Doğruluk</b><span>%${pct}</span></div><div class="tile"><b>Doğru</b><span>${L.right}/${L.qs.length}</span></div></div>
    <div class="col">${hasNext?`<button class="mainbtn" data-r="next">${PARTS[L.p+1]}e geç</button>`:""}<button class="${hasNext?"ghost":"mainbtn"}" data-r="sub">Bölümlere dön</button></div>`;
  show("result");
}
function failScreen(){
  $("#resultBody").innerHTML=`<div class="badge lose">${ICON.cross}</div><h2>Canların bitti</h2>
    <p>${PARTS[L.p]}de ${L.i+1}. soruya kadar geldin ve ${L.right} doğru yaptın. Bölüm baştan başlayacak.</p>
    <div class="col"><button class="mainbtn" data-r="retry">Bölümü tekrarla</button><button class="ghost" data-r="sub">Bölümlere dön</button></div>`;
  show("result");
}
$("#resultBody").addEventListener("click", e=>{
  const b=e.target.closest("[data-r]"); if(!b) return; const r=b.dataset.r;
  if(r==="retry") startPart(L.p); else if(r==="next") startPart(L.p+1);
  else { const d=partsDone(CUR.s.id); openPop = d<5?d:null; L=null; show("subview"); }
});

/* ============================================================
   ORTAK
   ============================================================ */
function show(id){
  ["home","subview","lesson","result"].forEach(k=>$("#"+k).hidden = k!==id);
  if(id==="home") renderHome(); if(id==="subview") renderSub();
  window.scrollTo(0,0);
}
function modal(h){ $("#modalCard").innerHTML=h; $("#modal").hidden=false; }
$("#modal").addEventListener("click", e=>{
  if(e.target.id==="modal"){ $("#modal").hidden=true; return; }
  const b=e.target.closest("[data-m]"); if(!b) return; const m=b.dataset.m; $("#modal").hidden=true;
  if(m==="quit"){ L=null; show("subview"); }
  if(m==="reset"){ prog={done:{},stars:{},xp:0,unit:prog.unit}; save(); renderHome(); }
});
renderHome();
/* ---- Uygulama eklentileri: Android geri tuşu + çevrimdışı çalışma ---- */
(function(){
  const vis = id => !document.getElementById(id).hidden;
  const _show = show;
  show = function(id){ _show(id); if(id!=="home" && !(history.state&&history.state.deep)) history.pushState({deep:1},""); };
  history.replaceState({deep:0},"");
  window.addEventListener("popstate", ()=>{
    const m=document.getElementById("modal");
    if(!m.hidden){ m.hidden=true; }
    else if(vis("lesson")){ document.getElementById("quitBtn").click(); }
    else if(vis("result")){ L=null; _show("subview"); }
    else if(vis("subview")){ _show("home"); return; }
    else return;
    history.pushState({deep:1},"");
  });
})();
</script>
